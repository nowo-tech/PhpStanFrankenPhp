# CI: PHP matrix (tooling package — no Symfony runtime dependency).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer config --unset platform.php
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        run: composer test

      - name: Run PHPStan on package
        run: composer phpstan

      - name: Coverage gate 100% (PHP 8.2 only)
        if: matrix.php == '8.2'
        run: composer coverage-check

      - name: Demo classic (expect errors)
        run: |
          if composer demo-classic; then
            echo "Expected findings on demo/classic/bad" >&2
            exit 1
          fi

      - name: Demo worker (expect errors)
        run: |
          if composer demo-worker; then
            echo "Expected findings on demo/worker/bad" >&2
            exit 1
          fi

      - name: Demo hardening (expect errors)
        run: |
          if composer demo-hardening; then
            echo "Expected findings on demo/hardening/bad" >&2
            exit 1
          fi

      - name: Demo good samples (must be clean)
        run: |
          composer demo-classic-good
          composer demo-worker-good
          composer demo-hardening-good

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config --unset platform.php
          composer update --no-interaction --prefer-dist --no-progress

      - name: PHP-CS-Fixer
        run: composer cs-check

      - name: Rector dry-run
        run: composer rector-dry
